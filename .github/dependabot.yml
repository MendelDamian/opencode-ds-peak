version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # @opentui/solid and @opentui/keymap pin their peer dependency to
      # solid-js@1.9.12 exactly, so any bump makes `npm ci` fail with ERESOLVE.
      # Drop this once @opentui widens the peer range.
      - dependency-name: "solid-js"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
