name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

  smoke:
    strategy:
      fail-fast: false
      matrix:
        # The CLI version is read from the installed devDependency at run time,
        # so a Dependabot bump of the plugin package moves the smoke test with
        # it and never needs a manual workflow edit.
        include:
          - target: v1
            plugin: "@opencode-ai/plugin"
            cli: opencode-ai
          - target: v2
            plugin: "@opencode/plugin"
            cli: "@opencode/cli"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install OpenCode
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/${{ matrix.plugin }}/package.json','utf8')).version")
          echo "Installing ${{ matrix.cli }}@$version (matching ${{ matrix.plugin }})"
          npm install -g "${{ matrix.cli }}@$version"
          opencode --version

      - name: Install the package and confirm OpenCode loads it
        run: node scripts/opencode-smoke.mjs --target "${{ matrix.target }}" --bin opencode
