name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v1
            opencode: opencode-ai@1.18.34
          - target: v2
            opencode: "@opencode/cli@2.0.23"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install OpenCode
        run: |
          npm install -g "${{ matrix.opencode }}"
          opencode --version

      - name: Install the package and confirm OpenCode loads it
        run: node scripts/opencode-smoke.mjs --target "${{ matrix.target }}" --bin opencode
