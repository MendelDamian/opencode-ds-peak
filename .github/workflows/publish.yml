name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11+, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org/
          cache: npm

      # setup-node writes an "_authToken=" placeholder into .npmrc (part of the
      # OIDC flow); pin a recent npm so trusted publishing works.
      - name: Prepare npm
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run check

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag version=$version"
          test "$tag" = "$version" || {
            echo "Tag v$tag does not match package.json version $version"
            exit 1
          }

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
