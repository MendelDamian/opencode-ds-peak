name: CI & publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run sanity

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub issues the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11+, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org/
          cache: npm

      # setup-node writes an "_authToken=" placeholder into .npmrc (part of the
      # OIDC flow); pin a recent npm so trusted publishing works.
      - name: Prepare npm
        run: |
          npm install -g npm@latest
          echo "--- .npmrc ---"; cat "$NPM_CONFIG_USERCONFIG"

      - run: npm ci

      # Only publish when package.json carries a version npm does not have yet.
      - name: Check whether version changed
        id: version
        env:
          PACKAGE: opencode-ds-peak
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PACKAGE" version 2>/dev/null || echo "")
          echo "local=$LOCAL published=${PUBLISHED:-none}"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public
